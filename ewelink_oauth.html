<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pombal IA — Ligar eWeLink</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--gold:#D4A843;--bg:#09090F;--card:#0F1019;--brd:rgba(255,255,255,0.08);--t1:#F0EDE8;--t2:#888590;--green:#3DC97A;--red:#E05555}
  body{background:var(--bg);color:var(--t1);font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .caixa{width:100%;max-width:440px;background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:28px}
  h1{font-family:Georgia,serif;color:var(--gold);font-size:22px;margin-bottom:6px}
  p{color:var(--t2);font-size:14px;line-height:1.5;margin-bottom:18px}
  label{display:block;font-size:13px;color:var(--t2);margin-bottom:6px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--brd);background:#13161F;color:var(--t1);font-size:16px;margin-bottom:16px}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--gold);color:#09090F;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .estado{margin-top:16px;font-size:14px;line-height:1.5}
  .estado.ok{color:var(--green)}
  .estado.erro{color:var(--red)}
</style>
</head>
<body>
<main class="caixa">
  <h1>Ligar a eWeLink</h1>
  <p id="explicacao">Liga a tua conta eWeLink uma vez para a app Pombal IA mostrar os sensores. O App Secret fica guardado no Google, não nesta página.</p>
  <label for="pin">PIN de ligação</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button id="botao" type="button">Ligar à eWeLink</button>
  <div id="estado" class="estado" role="status"></div>
</main>

<script>
const CHAVE_PIN_TEMPORARIO = 'pombal-pin-ligacao';
const TEMPO_LIMITE_SCRIPT_MS = 15000;

// Chama o script Google através de <script> (JSONP): não depende de CORS
function chamarScriptJsonp(urlScript, parametros) {
  return new Promise((resolver, rejeitar) => {
    const nomeCallback = `respostaPombal_${Date.now()}_${Math.floor(Math.random() * 1e6)}`;
    const elemento = document.createElement('script');
    const terminar = (erro, dados) => {
      clearTimeout(temporizador);
      window[nomeCallback] = () => {};
      elemento.remove();
      if (erro) rejeitar(erro); else resolver(dados);
    };
    const temporizador = setTimeout(() => terminar(new Error('o script demorou demasiado a responder')), TEMPO_LIMITE_SCRIPT_MS);
    window[nomeCallback] = dados => terminar(null, dados);
    elemento.onerror = () => terminar(new Error('não consegui contactar o script'));
    elemento.src = `${urlScript}?${new URLSearchParams({ ...parametros, callback: nomeCallback })}`;
    document.head.appendChild(elemento);
  });
}


function mostrarEstado(mensagem, tipo) {
  const elemento = document.getElementById('estado');
  elemento.textContent = mensagem;
  elemento.className = 'estado ' + (tipo || '');
}

async function lerUrlScript() {
  const resposta = await fetch('sensores-config.json', { cache: 'no-store' });
  if (!resposta.ok) throw new Error('Não encontrei o ficheiro sensores-config.json.');
  const config = await resposta.json();
  if (!config.urlScript || config.urlScript.startsWith('COLA_AQUI')) {
    throw new Error('Falta pôr o URL do script no sensores-config.json.');
  }
  return config.urlScript;
}

async function pedirScript(parametros) {
  const urlScript = await lerUrlScript();
  const dados = await chamarScriptJsonp(urlScript, parametros);
  if (!dados.ok) throw new Error(dados.erro || 'Erro desconhecido no script.');
  return dados;
}

async function iniciarLigacao() {
  const pin = document.getElementById('pin').value.trim();
  if (!pin) { mostrarEstado('Escreve o PIN primeiro.', 'erro'); return; }
  sessionStorage.setItem(CHAVE_PIN_TEMPORARIO, pin);
  mostrarEstado('A abrir a página da eWeLink…');
  const { url } = await pedirScript({ acao: 'urlLogin' });
  window.location.href = url;
}

async function concluirLigacao(codigo, regiao) {
  const pin = document.getElementById('pin').value.trim() || sessionStorage.getItem(CHAVE_PIN_TEMPORARIO);
  if (!pin) { mostrarEstado('Escreve o PIN e carrega em "Concluir ligação".', 'erro'); return; }
  mostrarEstado('A concluir a ligação…');
  await pedirScript({ acao: 'trocarCodigo', code: codigo, region: regiao, pin });
  sessionStorage.removeItem(CHAVE_PIN_TEMPORARIO);
  history.replaceState(null, '', location.pathname);
  mostrarEstado('✅ eWeLink ligada. Já podes fechar esta página e abrir a app Pombal IA.', 'ok');
  document.getElementById('botao').disabled = true;
}

function prepararPagina() {
  const parametros = new URLSearchParams(location.search);
  const codigo = parametros.get('code');
  const regiao = parametros.get('region') || 'eu';
  const botao = document.getElementById('botao');
  const tratarErro = erro => mostrarEstado('⚠️ ' + erro.message, 'erro');

  if (!codigo) {
    botao.addEventListener('click', () => iniciarLigacao().catch(tratarErro));
    return;
  }
  botao.textContent = 'Concluir ligação';
  botao.addEventListener('click', () => concluirLigacao(codigo, regiao).catch(tratarErro));
  if (sessionStorage.getItem(CHAVE_PIN_TEMPORARIO)) concluirLigacao(codigo, regiao).catch(tratarErro);
}

prepararPagina();
</script>
</body>
</html>
